<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Divya Dhwani</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2a66;--mut:#6b6f9a;--sun:#ffb627;--sun2:#d98c00;--pond:#2fc0d6;--pond2:#1b8fa5;--lot:#ff6f9c;--lot2:#d24776;--leaf:#6dbf3b;--leaf2:#489a22;--bg:#e8f3fb;--line:#cfdeee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:700 16px/1.45 "Nunito Sans",system-ui,sans-serif;color:var(--ink);background:#d5e8f6}
h1,h2,h3,.bl{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:800;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#app{max-width:480px;min-height:100%;margin:0 auto;background:var(--bg);position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);border-bottom:2px solid var(--line)}
.top h1{font-size:21px;flex:1}
.chip{display:flex;align-items:center;gap:5px;font-family:"Baloo 2";font-weight:800;font-size:17px;padding:2px 10px 0;border-radius:99px;background:#fff;border:2px solid var(--line)}
.chip svg{width:18px;height:18px}
.ub{margin:18px 14px 8px;padding:14px 16px;border-radius:18px;background:var(--c);box-shadow:0 5px 0 var(--d);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ub b{font:800 21px/1.1 "Baloo 2";display:block}.ub small{font-weight:700;opacity:.92}.ub span{font:800 18px "Baloo 2";background:#0002;border-radius:99px;padding:2px 12px 0}
.pth{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0 8px}
.pth:before{content:"";position:absolute;top:30px;bottom:40px;left:50%;border-left:5px dotted var(--line)}
.nd{position:relative;text-align:center;z-index:1;width:150px}
.nd small{display:block;margin-top:9px;font-weight:800;font-size:13px;color:var(--mut)}
.n{width:78px;height:78px;border-radius:50%;background:var(--c);box-shadow:0 8px 0 var(--d);display:grid;place-items:center;color:#fff;transition:transform .08s,box-shadow .08s;position:relative}
.n:active{transform:translateY(5px);box-shadow:0 3px 0 var(--d)}
.n svg{width:34px;height:34px}
.n.lk{--c:#c9d5e3;--d:#a7b5c7}
.n.rw{width:68px;height:68px;border-radius:22px;--c:#ffd54a;--d:#d6a400}
.n.rw.lk{--c:#c9d5e3;--d:#a7b5c7}
.n.cur:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--c);opacity:.5;animation:pu 1.6s ease-out infinite}
@keyframes pu{to{transform:scale(1.25);opacity:0}}
.go{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font:800 14px "Baloo 2";background:#fff;color:var(--c);border:2px solid var(--line);border-radius:12px;padding:1px 12px 0;animation:bn 1s ease-in-out infinite alternate;font-style:normal}
@keyframes bn{to{top:-36px}}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#fff;border-top:2px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));gap:6px;z-index:6}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;border-radius:14px;font:800 13px "Baloo 2";color:var(--mut);border:2px solid transparent}
.tabs svg{width:26px;height:26px}
.tabs button[aria-current=page]{color:var(--pond2);background:#dff6fa;border-color:var(--pond)}
.scn{position:relative}.scn svg{display:block;width:100%;height:auto}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none}
.lv{background:#fff;border:3px solid var(--sun);border-radius:16px;padding:3px 12px 0;font:800 18px "Baloo 2";box-shadow:0 3px 0 var(--sun2)}
.mt{flex:1;max-width:140px;height:14px;border-radius:9px;background:#fff9;border:2px solid #fff;overflow:hidden}.mt i{display:block;height:100%;background:var(--sun)}
.cap{margin:12px 14px;padding:12px 14px;background:#fff;border-radius:16px;border:2px solid var(--line);font-size:14px;color:var(--mut)}
.an{animation:rm var(--t) ease-in-out infinite alternate}.an>g{animation:bob .5s ease-in-out infinite alternate}
@keyframes rm{to{transform:translateX(var(--dx))}}@keyframes bob{to{transform:translateY(-2px)}}
.hb{cursor:pointer;animation:hv .8s ease-in-out infinite alternate}@keyframes hv{to{transform:translateY(-4px)}}
.cl{animation:rm var(--t) linear infinite alternate}
.rp{transform-box:fill-box;transform-origin:center;animation:rpl 3s ease-out infinite}@keyframes rpl{from{transform:scale(.4);opacity:.8}to{transform:scale(1.3);opacity:0}}
[data-p]{cursor:pointer}
.pg{padding:16px 14px}.pg h2{font-size:26px;margin:10px 0 8px}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stats .card{text-align:center;margin:0;padding:10px 4px}.stats b{display:block;font:800 26px "Baloo 2"}.stats span{font-size:12px;color:var(--mut)}
input.nm{width:100%;font:800 18px "Baloo 2";padding:8px 14px 4px;border:2px solid var(--line);border-radius:14px;color:var(--ink)}
.cert{border:3px double var(--sun2);background:#fffdf3;border-radius:16px;padding:18px;text-align:center;margin-bottom:12px}
.cert h3{font-size:24px;color:var(--sun2)}.cert .who{font:800 28px "Baloo 2";margin:6px 0}
.vid{display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px;border-radius:14px;background:linear-gradient(120deg,var(--lot),var(--sun));color:#fff;text-align:left}
.vid i{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}.vid small{display:block;opacity:.95}
.lock{opacity:.55;border-style:dashed}
.mini{display:inline-block;margin-top:14px;font-size:13px;color:var(--mut);text-decoration:underline}
#pl{position:fixed;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
#pl[hidden]{display:none}
.pt{display:flex;align-items:center;gap:12px;padding:14px}.x{font:800 30px/1 "Baloo 2";color:var(--mut);width:36px}
.bar{flex:1;height:16px;border-radius:9px;background:#e3ecf5;overflow:hidden}.bar i{display:block;height:100%;background:var(--leaf);border-radius:9px;transition:width .3s}
.pb{flex:1;overflow:auto;padding:6px 20px 20px;display:flex;flex-direction:column;gap:12px}
.pb h2{font-size:27px}.pb p{font-size:18px;line-height:1.5;font-weight:700;color:#4a4b82;max-width:60ch}
.big{width:220px;height:190px;align-self:center;background:radial-gradient(closest-side,#dff3c9 70%,transparent 72%)}
.op{text-align:left;font:800 18px/1.3 "Nunito Sans";padding:15px 16px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:#fff}
.op[aria-pressed=true]{border-color:var(--pond);background:#e2f8fb;color:var(--pond2)}
.op.ok{border-color:var(--leaf);background:#e8f8d9;color:var(--leaf2)}.op.no{border-color:#ee6a5a;background:#ffe6e2;color:#c13b2c}
.ft{padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line)}
.ft.ok{background:#dff5c8;border-color:#dff5c8}.ft.no{background:#ffdcd6;border-color:#ffdcd6}
.ft b{font:800 22px "Baloo 2";display:block}.ft p{font-size:15px;margin-bottom:10px}.ft.ok b{color:var(--leaf2)}.ft.no b{color:#c13b2c}
.bb{width:100%;padding:14px 0 10px;border-radius:16px;background:var(--leaf);box-shadow:0 5px 0 var(--leaf2);color:#fff;font:800 20px "Baloo 2"}
.bb:active{transform:translateY(3px);box-shadow:0 2px 0 var(--leaf2)}.bb:disabled{background:#d6e0ea;box-shadow:0 5px 0 #b6c3d1;color:#8d9db0;cursor:default}
.ft.no .bb{background:#ee6a5a;box-shadow:0 5px 0 #c13b2c}
.ghost{display:block;width:100%;margin-top:10px;padding:10px;font:800 17px "Baloo 2";color:var(--pond2)}
.fin{align-items:center;text-align:center;justify-content:center}
.fin .big{width:260px;height:220px}
.gain{display:flex;gap:10px;justify-content:center}.gain div{border:2px solid var(--sun);border-radius:14px;padding:4px 16px 0;font:800 20px "Baloo 2";color:var(--sun2);min-width:100px}.gain small{display:block;font-size:12px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;z-index:30;max-width:92%;text-align:center;box-shadow:0 6px 20px #0003}
.cf{position:fixed;top:-10px;width:10px;height:14px;z-index:40;animation:fl 2.2s ease-in forwards;pointer-events:none}
@keyframes fl{to{transform:translate(var(--x),105vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"><div class="top"><h1>Divya Dhwani</h1><div class="chip" title="Day streak"><svg viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 2 3 4 1-3 1-6 1-9z" fill="#ff8a1f"/></svg><span id="sk">0</span></div><div class="chip" title="Karuna"><svg viewBox="0 0 24 24"><path d="M12 21C3 14 3 6 8 5c2 0 3 1 4 3 1-2 2-3 4-3 5 1 5 9-4 16z" fill="#ff6f9c"/></svg><span id="xp">0</span></div></div><div id="main"></div></div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="pl" hidden role="dialog" aria-modal="true"></div>
<script>
const $=s=>document.querySelector(s);
let S={name:"",xp:0,streak:0,last:"",done:{},care:{}};
try{S={...S,...JSON.parse(localStorage.getItem("dd2")||"{}")}}catch(e){}
const save=()=>{try{localStorage.setItem("dd2",JSON.stringify(S))}catch(e){}};
const U=[{t:"Making Friends",st:"Recognition",k:"Jīva: life in every being",c:"#ffb627",d:"#d98c00",plot:"Friendship Garden"},{t:"Listening Closely",st:"Understanding",k:"Divya dhwani: listening beyond words",c:"#2fc0d6",d:"#1b8fa5",plot:"Listening Pond"},{t:"Living With Ahimsa",st:"Action",k:"Choosing the least harm",c:"#ff6f9c",d:"#d24776",plot:"Peace Orchard"}];
const LS=[
{id:"u1a",u:0,t:"Lizzie & Lily",rw:"Lizzie & Lily arrive",ra:"horse",steps:[
{i:"horse",h:"Lizzie puts a blanket on Lily",b:"Caregivers saw Lizzie draping a blanket over her friend Lily. Nobody taught her to. Friendship starts with paying attention."},
{q:"What does the blanket moment suggest?",a:["Horses can care about specific companions","Horses only copy people","It happens by accident every time"],c:0,x:"Animals form real bonds and show preferences. Watch each individual rather than assuming."},
{i:"cow",h:"Velvet joins the herd",b:"Trust takes time. When Velvet arrived, the herd needed days to say hello. Belonging is built slowly."},
{q:"A cow often rests beside the same companion. What’s a thoughtful reading?",a:["All cows act the same","She may have a favorite friend","She is copying a human"],c:1,x:"Social bonds are individual. Noticing preferences is where compassion begins."}]},
{id:"u1b",u:0,t:"The elephant & the rabbit",rw:"Friendship Garden",ra:"lotus",steps:[
{i:"lotus",h:"A story of kinship",b:"A Jain tradition tells of an elephant who stands on one leg for days rather than crush a rabbit sheltering beneath him."},
{q:"What does the elephant’s choice teach?",a:["Strength means protecting the vulnerable","Rabbits are faster than elephants","Elephants are always gentle"],c:0,x:"Compassion isn’t limited to our own kind, and it can ask something of us."},
{i:"lotus",h:"Jīva",b:"Jain teaching sees every living being as a jīva, with its own life and feelings. Seeing that is where ahimsa begins."},
{q:"What does “jīva” point to?",a:["A being with its own life and experience","A kind of farm tool","Only humans"],c:0,x:"Every animal is someone, not something."}]},
{id:"u2a",u:1,t:"Kiddo & Cass",rw:"Kiddo & Cass arrive",ra:"sheep",steps:[
{i:"sheep",h:"Three months to learn their names",b:"It took Ashni three months to tell Kiddo and Cass apart. Patience is a way of respecting someone."},
{q:"A horse turns her head away as you approach. Best first move?",a:["Move closer and insist","Pause, give space, watch other signals","Decide she’s being stubborn"],c:1,x:"Turning away can mean “I need space.” Pause, observe and respect the cue."},
{i:"horse",h:"Not every animal wants a hug",b:"Some residents keep their distance, and caregivers honor it. Respecting “no” is also care."},
{q:"Dezi offers a hoof. What’s a respectful response?",a:["Follow her cues","Repeat until she reacts","Assume she always wants to shake"],c:0,x:"Let the animal lead the conversation."}]},
{id:"u2b",u:1,t:"Divya Dhwani",rw:"Listening Pond",ra:"lotus",steps:[
{i:"lotus",h:"A voice beyond words",b:"Jain tradition speaks of Bhagwan Mahavir’s divya dhwani, a voice each listener understood in their own way. Listening goes beyond one language."},
{q:"What attitude does listening beyond words ask for?",a:["Humility","Speed","Certainty"],c:0,x:"Humility keeps us curious about what another being is telling us."},
{i:"lotus",h:"Listen, don’t assume",b:"One gesture rarely tells the whole story. Watch posture, ears, distance and context together."},
{q:"Best way to read an animal’s mood?",a:["Look at a single gesture","Combine many signals over time","Guess from how you feel"],c:1,x:"Behavior offers clues, not proof. Stay curious, not certain."}]},
{id:"u3a",u:2,t:"Maybell & Jale",rw:"Maybell arrives",ra:"cow",steps:[
{i:"cow",h:"Maybell’s bond",b:"Maternal bonds matter to cows, and Maybell’s caregivers honor hers. Small acts of care shape a whole life."},
{q:"Wild birds are gathering wool left outside. What does it show?",a:["Small kindnesses reach beyond us","Wool is only for sheep","Nothing, it’s trivial"],c:0,x:"Small choices ripple outward, even to creatures we never meet."},
{i:"horse",h:"Jale says no",b:"Jale made it clear she didn’t want to be ridden, and her caregiver Aoife listened. Respecting an animal’s “no” is an act of ahimsa."},
{q:"In daily life, ahimsa means…",a:["Only avoiding direct harm","Choosing the least harmful option available","Doing nothing"],c:1,x:"Ahimsa is an active search for the gentlest path."}]},
{id:"u3b",u:2,t:"King Megharath",rw:"Peace Orchard",ra:"lotus",steps:[
{i:"lotus",h:"A pigeon, a hawk, a king",b:"A pigeon flees to King Megharath for safety, but the hawk is hungry too. The king offers a weight of his own flesh instead of letting either be harmed."},
{q:"What does the dilemma teach?",a:["Compassion can be costly and complicated","Hawks are villains","Rules never matter"],c:0,x:"Real compassion weighs every being’s need."},
{i:"lotus",h:"Choose the least harm",b:"No path is perfect, but ahimsa asks us to look for the gentlest one. Small, informed choices add up."},
{q:"Which is the ahimsa-minded choice?",a:["Ignore the impact of choices","Learn the impact, then choose the gentlest option","Wait for a perfect option"],c:1,x:"Learning first, then acting, is how everyday ahimsa works."}]}];
const SH='<ellipse cx="30" cy="48" rx="19" ry="3" fill="#0002"/>';
const ART={
horse:(c="#b9794a",m="#4a2f22")=>`${SH}<g fill="${m}"><rect x="14" y="33" width="5" height="15" rx="2.5"/><rect x="22" y="34" width="5" height="14" rx="2.5"/><rect x="36" y="34" width="5" height="14" rx="2.5"/><rect x="43" y="33" width="5" height="15" rx="2.5"/><path d="M12 28Q1 30 4 43Q9 36 14 33Z"/></g><ellipse cx="29" cy="30" rx="19" ry="10.5" fill="${c}"/><ellipse cx="25" cy="27" rx="9" ry="4" fill="#fff3" /><path d="M40 26L47 8L58 13L50 33Z" fill="${c}"/><ellipse cx="55" cy="14" rx="8" ry="5.5" fill="${c}" transform="rotate(25 55 14)"/><path d="M44 8Q39 18 45 30L48 28Q46 18 49 8Z" fill="${m}"/><path d="M47 7l1-6 4 5z" fill="${c}"/><circle cx="56" cy="11.5" r="1.5" fill="#222"/>`,
sheep:()=>`${SH}<g fill="#3b3340"><rect x="20" y="36" width="4" height="12" rx="2"/><rect x="36" y="36" width="4" height="12" rx="2"/></g><g fill="#fff"><circle cx="19" cy="30" r="10"/><circle cx="30" cy="24" r="11"/><circle cx="41" cy="30" r="10"/><circle cx="30" cy="34" r="10"/></g><g fill="#e9e4f2"><circle cx="24" cy="38" r="5"/><circle cx="38" cy="36" r="5"/></g><ellipse cx="49" cy="29" rx="7" ry="6.5" fill="#3b3340"/><ellipse cx="43" cy="24" rx="4" ry="2" fill="#3b3340" transform="rotate(-30 43 24)"/><circle cx="51" cy="27" r="1.4" fill="#fff"/>`,
cow:()=>`${SH}<g fill="#f6f6fa"><rect x="14" y="34" width="6" height="14" rx="3"/><rect x="24" y="35" width="6" height="13" rx="3"/><rect x="36" y="35" width="6" height="13" rx="3"/><rect x="44" y="34" width="6" height="14" rx="3"/></g><g fill="#3b3340"><rect x="14" y="44" width="6" height="4" rx="2"/><rect x="44" y="44" width="6" height="4" rx="2"/></g><ellipse cx="29" cy="30" rx="20" ry="11" fill="#fff"/><g fill="#3b3340"><ellipse cx="21" cy="26" rx="7" ry="5"/><ellipse cx="37" cy="34" rx="6" ry="4"/></g><ellipse cx="50" cy="25" rx="9" ry="8" fill="#fff"/><ellipse cx="55" cy="30" rx="6" ry="4.5" fill="#ffb3c1"/><path d="M45 17q-2-5-5-5M54 17q2-5 5-4" stroke="#e8d9a8" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="43" cy="22" rx="4" ry="2" fill="#3b3340" transform="rotate(30 43 22)"/><circle cx="51" cy="22" r="1.5" fill="#222"/>`,
lotus:()=>`<ellipse cx="30" cy="42" rx="24" ry="6" fill="#4ba83a"/><ellipse cx="30" cy="40" rx="24" ry="5" fill="#69c24e"/><g fill="#ff8fb3">${[-60,-30,0,30,60].map(a=>`<ellipse cx="30" cy="25" rx="5.5" ry="13" transform="rotate(${a} 30 38)"/>`).join("")}</g><ellipse cx="30" cy="27" rx="5" ry="11" fill="#ffc2d6"/><circle cx="30" cy="35" r="4" fill="#ffb627"/>`};
const art=(t,c,m)=>ART[t](c,m);
const I={ck:'<svg viewBox="0 0 24 24"><path d="M4 12l5 5 11-11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>',pl:'<svg viewBox="0 0 24 24"><path d="M8 4l12 8-12 8z" fill="#fff"/></svg>',lk:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="3" fill="#fff"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#fff" stroke-width="3"/></svg>',st:'<svg viewBox="0 0 24 24"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#fff"/></svg>'};
const tree=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="2" rx="22" ry="6" fill="#0002"/><rect x="-5" y="-20" width="10" height="22" rx="3" fill="#8b5a2b"/><circle cx="-12" cy="-30" r="16" fill="#3f9f3a"/><circle cx="12" cy="-30" r="16" fill="#3f9f3a"/><circle cx="0" cy="-42" r="18" fill="#4fb043"/><circle cx="-6" cy="-47" r="9" fill="#78d05a"/></g>`;
const fruitTree=(x,y)=>tree(x,y,.8)+[[-10,-32],[8,-38],[0,-26],[14,-28]].map(p=>`<circle cx="${x+p[0]*.8}" cy="${y+p[1]*.8}" r="3.2" fill="#ff8a2a"/>`).join("");
const RES=[{id:"u1a",t:"horse",x:128,y:292,c:"#b9794a",n:"Lizzie",s:"Lizzie tucks a blanket over her best friend Lily."},{id:"u1a",t:"horse",x:196,y:306,c:"#d8d2c8",m:"#6b6258",n:"Lily",s:"Lily naps best when Lizzie is nearby."},{id:"u2a",t:"sheep",x:236,y:340,n:"Kiddo",s:"It took three months to learn who was Kiddo and who was Cass."},{id:"u2a",t:"sheep",x:268,y:318,n:"Cass",s:"Cass takes her time with new people. Patience works."},{id:"u3a",t:"cow",x:150,y:352,n:"Maybell",s:"Maybell’s caregivers honor her bond with her calf."}];
const done=id=>!!S.done[id];
function scene(){
const g=(n)=>done(n);
const cl=(x,y,t)=>`<g class="cl" style="--dx:40px;--t:${t}s"><g fill="#fff" opacity=".9"><ellipse cx="${x}" cy="${y}" rx="30" ry="10"/><ellipse cx="${x+14}" cy="${y-8}" rx="18" ry="11"/><ellipse cx="${x-14}" cy="${y-5}" rx="14" ry="8"/></g></g>`;
const fl=(x,y)=>["#ff6f9c","#ffb627","#fff","#b79cff"].map((c,i)=>{const a=i*1.6+x,r=7+i*4;return`<g transform="translate(${x+Math.cos(a)*r*2} ${y+Math.sin(a)*r})"><circle r="5" fill="${c}"/><circle r="2" fill="#ffd54a"/></g>`}).join("");
const lk=(x,y,n)=>`<g data-p="${n}"><ellipse cx="${x}" cy="${y}" rx="52" ry="26" fill="#5da83a" stroke="#fff" stroke-width="3" stroke-dasharray="7 6" opacity=".9"/><rect x="${x-3}" y="${y-30}" width="6" height="30" fill="#8b5a2b"/><rect x="${x-18}" y="${y-38}" width="36" height="20" rx="5" fill="#e2b46a" stroke="#8b5a2b" stroke-width="2"/><text x="${x}" y="${y-24}" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="13" fill="#6a431c">Soon</text></g>`;
let s=`<svg viewBox="0 0 360 480" role="img" aria-label="Your sanctuary"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fcbf4"/><stop offset="1" stop-color="#e6f7ff"/></linearGradient><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93dc5c"/><stop offset="1" stop-color="#5fb335"/></linearGradient><pattern id="tf" width="26" height="22" patternUnits="userSpaceOnUse"><path d="M5 8l2-6 2 6M17 18l2-6 2 6" stroke="#4e9f2c" stroke-width="2" fill="none" stroke-linecap="round" opacity=".45"/></pattern></defs>
<rect width="360" height="480" fill="url(#sky)"/><circle cx="305" cy="52" r="42" fill="#fff2a8" opacity=".5"/><circle cx="305" cy="52" r="26" fill="#ffe36e"/>${cl(70,48,26)}${cl(210,86,34)}
<path d="M0 150Q80 98 170 140T360 122V210H0Z" fill="#aee08b"/><path d="M0 172Q120 124 240 166T360 148V230H0Z" fill="#86cf5a"/>
<path d="M0 178Q180 148 360 178V480H0Z" fill="url(#gr)"/><path d="M0 178Q180 148 360 178V480H0Z" fill="url(#tf)"/>
<path d="M58 212Q76 276 150 304T236 480" stroke="#d9b373" stroke-width="40" fill="none" stroke-linecap="round"/><path d="M58 212Q76 276 150 304T236 480" stroke="#efd29a" stroke-width="30" fill="none" stroke-linecap="round"/>
<g transform="translate(22 112)"><ellipse cx="46" cy="104" rx="60" ry="9" fill="#0002"/><rect y="32" width="92" height="70" fill="#d6503f"/><rect x="46" y="32" width="46" height="70" fill="#b93e30"/><path d="M-8 36L46 0L100 36Z" fill="#7e2a27"/><path d="M-8 36L46 0L46 36Z" fill="#9a3430"/><rect x="30" y="56" width="30" height="46" fill="#fff6e2" stroke="#7e2a27" stroke-width="3"/><path d="M30 56L60 102M60 56L30 102" stroke="#7e2a27" stroke-width="3"/><circle cx="46" cy="22" r="6" fill="#fff6e2" stroke="#7e2a27" stroke-width="2"/></g>`;
for(let i=0;i<9;i++)s+=`<rect x="${128+i*26}" y="186" width="6" height="26" rx="2" fill="#f5e6c4" stroke="#c9a766" stroke-width="1.5"/>`;
s+=`<rect x="128" y="192" width="230" height="5" fill="#f5e6c4" stroke="#c9a766" stroke-width="1.5"/><rect x="128" y="202" width="230" height="5" fill="#f5e6c4" stroke="#c9a766" stroke-width="1.5"/>`+tree(318,252,1.15)+tree(40,330,.9);
s+=g("u3b")?fruitTree(70,288)+fruitTree(112,262)+`<ellipse cx="80" cy="312" rx="10" ry="5" fill="#c58a45"/>`:lk(78,280,"Finish “King Megharath” to grow the Peace Orchard");
s+=g("u2b")?`<g transform="translate(92 414)"><ellipse rx="72" ry="36" fill="#b9a98f"/><ellipse rx="66" ry="31" fill="#2fc0d6"/><ellipse cx="-8" cy="-8" rx="44" ry="14" fill="#6ee0ee" opacity=".6"/><ellipse class="rp" rx="30" ry="12" fill="none" stroke="#fff" stroke-width="2"/><g transform="translate(-26 -4) scale(.5)"><g>${art("lotus")}</g></g><g transform="translate(14 4) scale(.4)">${art("lotus")}</g></g>`:lk(92,414,"Finish “Divya Dhwani” to open the Listening Pond");
s+=g("u1b")?`<g><ellipse cx="258" cy="410" rx="62" ry="28" fill="#7ccc4a"/>${fl(238,404)}${fl(272,418)}<rect x="262" y="384" width="34" height="8" rx="3" fill="#a9733b"/><rect x="265" y="391" width="4" height="8" fill="#6a431c"/><rect x="289" y="391" width="4" height="8" fill="#6a431c"/></g>`:lk(258,410,"Finish “The elephant & the rabbit” to plant the Friendship Garden");
RES.forEach((r,i)=>{if(!g(r.id))return;const rdy=Date.now()-(S.care[i]||0)>45000;s+=`<g data-r="${i}" transform="translate(${r.x-30} ${r.y-44})"><g class="an" style="--dx:${i%2?-26:28}px;--t:${6+i*1.7}s"><g>${art(r.t,r.c,r.m)}</g>${rdy?`<g class="hb"><circle cx="30" cy="-8" r="11" fill="#fff" stroke="#ff6f9c" stroke-width="2.5"/><path d="M30 -1C21 -8 25 -16 30 -11 35 -16 39 -8 30 -1Z" fill="#ff6f9c"/></g>`:""}</g></g>`});
return s+"</svg>"}
function nodeOff(i){return[-44,44,0][i]||0}
function learn(){let h="";U.forEach((u,ui)=>{const ls=LS.filter(l=>l.u==ui),n=ls.filter(l=>done(l.id)).length;
h+=`<div class="ub" style="--c:${u.c};--d:${u.d}"><div><b>${u.t}</b><small>${u.st} · ${u.k}</small></div><span>${n}/2</span></div><div class="pth" style="--c:${u.c};--d:${u.d}">`;
ls.forEach((l,i)=>{const ix=LS.indexOf(l),open=ix==0||done(LS[ix-1].id),dn=done(l.id),cur=open&&!dn;
h+=`<div class="nd" style="left:${nodeOff(i)}px">${cur?'<i class="go">START</i>':""}<button class="n ${open?"":"lk"} ${cur?"cur":""}" data-l="${l.id}" aria-label="${l.t}${dn?", completed":open?"":", locked"}">${dn?I.ck:open?I.pl:I.lk}</button><small>${l.t}</small></div>`});
const pd=done(ls[1].id);h+=`<div class="nd"><button class="n rw ${pd?"":"lk"}" data-go="sanctuary" aria-label="${u.plot}">${pd?I.st:I.lk}</button><small>${u.plot}</small></div></div>`});
return h+'<p class="pg" style="text-align:center;color:var(--mut);font-size:13px">Draft content. Jain stories and resident details await subject-matter review.</p>'}
function sanc(){const n=Object.values(S.done).filter(Boolean).length,lv=1+n;
return`<div class="scn">${scene()}<div class="hud"><div class="lv">Level ${lv}</div><div class="mt" aria-hidden="true"><i style="width:${n/6*100}%"></i></div></div></div><div class="cap">Tap a resident’s heart to collect Karuna. Every lesson you finish brings a new neighbor or a new corner of the sanctuary.</div>`}
function me(){let c="";U.forEach((u,ui)=>{const ok=LS.filter(l=>l.u==ui).every(l=>done(l.id));
c+=ok?`<div class="cert"><h3>Certificate of Compassion</h3><p>awarded to</p><div class="who">${esc(S.name||"A Kind Learner")}</div><p>for completing <b>${u.t}</b></p><div class="vid"><i><svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 4l12 8-12 8z" fill="#ff6f9c"/></svg></i><div><b>Thank you from Ashni</b><small>30-second video lands here</small></div></div></div>`:`<div class="card lock"><b class="bl">${u.t}</b><br><span style="font-size:14px;color:var(--mut)">Finish both lessons to earn this certificate and a thank-you video.</span></div>`});
const n=Object.values(S.done).filter(Boolean).length;
return`<div class="pg"><h2>Your profile</h2><label for="nm" style="font-size:14px;color:var(--mut)">Name on your certificates</label><input id="nm" class="nm" value="${esc(S.name)}" maxlength="30" placeholder="Type your name"><div class="stats"><div class="card"><b>${S.streak}</b><span>day streak</span></div><div class="card"><b>${S.xp}</b><span>Karuna</span></div><div class="card"><b>${n}/6</b><span>lessons</span></div></div><h2>Certificates</h2>${c}<button class="mini" data-reset>Reset my progress</button></div>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let view=["learn","sanctuary","me"].includes(location.hash.slice(1))?location.hash.slice(1):"learn";
const TB=[["learn","Learn",'<svg viewBox="0 0 24 24"><path d="M3 5c4-1 7 0 9 2 2-2 5-3 9-2v13c-4-1-7 0-9 2-2-2-5-3-9-2z" fill="currentColor"/></svg>'],["sanctuary","Sanctuary",'<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="7" fill="currentColor"/><rect x="10.5" y="13" width="3" height="9" rx="1.5" fill="currentColor"/></svg>'],["me","Me",'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5" fill="currentColor"/><path d="M3 22c0-5 4-8 9-8s9 3 9 8z" fill="currentColor"/></svg>']];
function render(){$("#sk").textContent=S.streak;$("#xp").textContent=S.xp;
$("#main").innerHTML=view=="learn"?learn():view=="sanctuary"?sanc():me();
$("#tabs").innerHTML=TB.map(t=>`<button data-t="${t[0]}" ${view==t[0]?'aria-current="page"':""}>${t[2]}${t[1]}</button>`).join("")}
function go(v){view=v;try{location.hash=v}catch(e){}render();scrollTo(0,0)}
function toast(m){document.querySelectorAll(".toast").forEach(e=>e.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;t.setAttribute("role","status");document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function confetti(){const c=["#ffb627","#ff6f9c","#2fc0d6","#6dbf3b","#b79cff"];for(let i=0;i<46;i++){const e=document.createElement("i");e.className="cf";e.style.cssText=`left:${Math.random()*100}vw;background:${c[i%5]};--x:${(Math.random()-.5)*160}px;animation-delay:${Math.random()*.4}s;border-radius:${i%2?"50%":"2px"}`;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}}
let P=null;
function play(id){const L=LS.find(l=>l.id==id);P={L,q:[...L.steps],n:0,tot:L.steps.length,sel:null,chk:false,ok:false,wrong:0};$("#pl").hidden=false;step()}
function step(){if(!P.q.length)return fin();const s=P.q[0],pct=P.n/P.tot*100;
let b,f;
if(s.i){b=`<svg class="big" viewBox="0 0 60 50" aria-hidden="true">${art(s.i)}</svg><h2>${s.h}</h2><p>${s.b}</p>`;f=`<div class="ft"><button class="bb" data-c>Continue</button></div>`}
else{b=`<h2>${s.q}</h2>`+s.a.map((a,i)=>`<button class="op ${P.chk?(i==s.c?"ok":i==P.sel?"no":""):""}" data-o="${i}" aria-pressed="${P.sel===i}" ${P.chk?"disabled":""}>${a}</button>`).join("");
f=P.chk?`<div class="ft ${P.ok?"ok":"no"}"><b>${P.ok?"Beautifully noticed!":"Not quite"}</b><p>${s.x}</p><button class="bb" data-c>Continue</button></div>`:`<div class="ft"><button class="bb" data-k ${P.sel===null?"disabled":""}>Check</button></div>`}
$("#pl").innerHTML=`<div class="pt"><button class="x" data-x aria-label="Close lesson">×</button><div class="bar"><i style="width:${pct}%"></i></div></div><div class="pb">${b}</div>${f}`}
function fin(){const L=P.L,first=!done(L.id),bonus=10+(P.wrong?0:5);
if(first){done(L.id)||(S.done[L.id]=true);S.xp+=bonus;const t=new Date().toISOString().slice(0,10),y=new Date(Date.now()-864e5).toISOString().slice(0,10);if(S.last!=t){S.streak=S.last==y?S.streak+1:1;S.last=t}save()}
const u=U[L.u],unit=LS.filter(l=>l.u==L.u).every(l=>done(l.id));
$("#pl").innerHTML=`<div class="pb fin"><svg class="big" viewBox="0 0 60 50" aria-hidden="true">${art(L.ra)}</svg><h1 style="font-size:32px">${L.rw}!</h1><p>${L.ra=="lotus"?"A new corner of your sanctuary is open.":"A new neighbor has moved into your sanctuary."}</p><div class="gain"><div>+${first?bonus:0}<small>Karuna</small></div><div>${S.streak}<small>day streak</small></div></div>${unit?`<p>You finished <b>${u.t}</b>. Your certificate and a thank-you video from Ashni are waiting in Me.</p>`:""}</div><div class="ft"><button class="bb" data-sv>Visit my sanctuary</button><button class="ghost" data-x>Back to the path</button></div>`;
if(first)confetti()}
document.addEventListener("click",e=>{const t=e.target.closest("button,[data-r],[data-p]");if(!t)return;const d=t.dataset;
if(d.t)return go(d.t);if(d.go)return go(d.go);
if(d.l){const l=LS.find(x=>x.id==d.l),ix=LS.indexOf(l);if(ix>0&&!done(LS[ix-1].id))return toast("Finish the lesson before this one first.");return play(d.l)}
if(d.x!==undefined){$("#pl").hidden=true;P=null;return render()}
if(d.sv!==undefined){$("#pl").hidden=true;P=null;return go("sanctuary")}
if(d.o!==undefined&&P&&!P.chk){P.sel=+d.o;return step()}
if(d.k!==undefined){const s=P.q[0];P.chk=true;P.ok=P.sel===s.c;if(!P.ok)P.wrong++;return step()}
if(d.c!==undefined){if(!P.q[0].q||P.ok){P.q.shift();P.n++}else P.q.push(P.q.shift());P.chk=false;P.sel=null;return step()}
if(d.reset!==undefined){if(confirm("Reset all progress on this device?")){S={name:"",xp:0,streak:0,last:"",done:{},care:{}};save();render()}return}
if(d.r!==undefined){const i=+d.r,r=RES[i];if(Date.now()-(S.care[i]||0)>45000){S.care[i]=Date.now();S.xp+=5;save();render();toast(`${r.n} says thank you. +5 Karuna`)}else toast(`${r.n}: ${r.s}`);return}
if(d.p!==undefined)return toast(d.p)});
document.addEventListener("input",e=>{if(e.target.id=="nm"){S.name=e.target.value;save()}});
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&P){$("#pl").hidden=true;P=null;render()}});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["learn","sanctuary","me"].includes(h)&&h!=view){view=h;render()}});
setInterval(()=>{if(view=="sanctuary"&&!P)render()},15000);
render();
</script></body></html>
